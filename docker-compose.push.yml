services:
  push:
    build:
      context: .
      target: push
    image: ${PUSH_IMAGE:-tangash/push:1.4.8-2026082904}
    container_name: push
    restart: always
    expose:
      - "4500"
    environment:
      - NODE_ENV=production
      - PORT=4500
      - PUSH_API_TOKEN=${PUSH_API_TOKEN}
      - MODERATION_ADMIN_TOKEN=${MODERATION_ADMIN_TOKEN}
      - MODERATION_STATUS_SIGNING_PRIVATE_KEY=${MODERATION_STATUS_SIGNING_PRIVATE_KEY}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID}
      - FCM_CREDENTIALS_JSON=${FCM_CREDENTIALS_JSON}
      - APNS_TEAM_ID=${APNS_TEAM_ID}
      - APNS_KEY_ID=${APNS_KEY_ID}
      - APNS_PRIVATE_KEY=${APNS_PRIVATE_KEY}
      - APNS_VOIP_TOPIC=${APNS_VOIP_TOPIC}
      - APNS_MESSAGES_TOPIC=${APNS_MESSAGES_TOPIC}
      - APNS_USE_SANDBOX=${APNS_USE_SANDBOX}
      - PUSH_OBSERVABILITY_DATABASE_URL=postgres://peerlink:${PUSH_OBSERVABILITY_POSTGRES_PASSWORD:-peerlink_observability}@push-observability-db:5432/peerlink_observability
    depends_on:
      - push-observability-db

  moderation-ui:
    image: ${MODERATION_UI_NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: peerlink-moderation-ui
    restart: always
    depends_on:
      - push
    ports:
      - "127.0.0.1:4501:80"
    volumes:
      - ./deploy/push/moderation-ui:/usr/share/nginx/html:ro
      - ./deploy/push/moderation-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  server-checker:
    build:
      context: .
      target: server-checker
    image: ${SERVER_CHECKER_IMAGE:-tangash/server-checker:1.4.8-2026082904}
    container_name: peerlink-server-checker
    restart: always
    depends_on:
      - push-observability-db
    environment:
      - NODE_ENV=production
      - PUSH_OBSERVABILITY_DATABASE_URL=postgres://peerlink:${PUSH_OBSERVABILITY_POSTGRES_PASSWORD:-peerlink_observability}@push-observability-db:5432/peerlink_observability
      - PEERLINK_SERVER_CHECK_INTERVAL_MS=${PEERLINK_SERVER_CHECK_INTERVAL_MS:-300000}
      - PEERLINK_SERVER_CHECK_TIMEOUT_MS=${PEERLINK_SERVER_CHECK_TIMEOUT_MS:-5000}

  push-observability-db:
    image: ${PUSH_OBSERVABILITY_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: push-observability-db
    restart: always
    environment:
      - POSTGRES_DB=peerlink_observability
      - POSTGRES_USER=peerlink
      - POSTGRES_PASSWORD=${PUSH_OBSERVABILITY_POSTGRES_PASSWORD:-peerlink_observability}
    volumes:
      - push-observability-db:/var/lib/postgresql/data

  prometheus:
    image: ${PUSH_PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: push-prometheus
    restart: always
    depends_on:
      - push
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/push/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - push-prometheus:/prometheus

  grafana:
    image: ${PUSH_GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    container_name: push-grafana
    restart: always
    depends_on:
      - prometheus
      - push-observability-db
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change_me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - PUSH_OBSERVABILITY_POSTGRES_PASSWORD=${PUSH_OBSERVABILITY_POSTGRES_PASSWORD:-peerlink_observability}
    volumes:
      - ./deploy/push/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - push-grafana:/var/lib/grafana

  push-proxy:
    image: ${PUSH_NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: push-proxy
    restart: always
    depends_on:
      - push
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/push/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/push/certbot/www:/var/www/certbot:ro
      - ./deploy/push/letsencrypt:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          sleep 6h & wait $$!
          nginx -s reload || true
        done &
        exec nginx -g 'daemon off;'

  certbot:
    image: ${PUSH_CERTBOT_IMAGE:-certbot/certbot:v2.11.0}
    profiles:
      - ops
    volumes:
      - ./deploy/push/certbot/www:/var/www/certbot
      - ./deploy/push/letsencrypt:/etc/letsencrypt

  certbot-renewer:
    image: ${PUSH_CERTBOT_IMAGE:-certbot/certbot:v2.11.0}
    container_name: push-certbot-renewer
    restart: always
    depends_on:
      - push-proxy
    volumes:
      - ./deploy/push/certbot/www:/var/www/certbot
      - ./deploy/push/letsencrypt:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        trap exit TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h & wait $$!
        done

volumes:
  push-observability-db:
  push-prometheus:
  push-grafana:
