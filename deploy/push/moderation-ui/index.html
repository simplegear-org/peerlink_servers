<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeerLink X Moderation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #1f2630;
      --text: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #2ea043;
      --accent-2: #58a6ff;
      --warn: #d29922;
      --danger: #f85149;
      --danger-strong: #da3633;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: 0; }
    main { width: min(1320px, 100%); margin: 0 auto; padding: 20px 24px 28px; }
    input, textarea, button {
      height: 38px;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
    }
    input { width: 100%; padding: 0 12px; outline: none; }
    textarea {
      width: 100%;
      min-height: 132px;
      padding: 12px;
      resize: vertical;
      outline: none;
      line-height: 1.45;
    }
    input:focus, textarea:focus { border-color: var(--accent-2); }
    button {
      padding: 0 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    button:hover { border-color: #6e7681; background: var(--panel-2); }
    button:active { transform: translateY(1px); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.warn { background: rgba(210, 153, 34, 0.16); border-color: rgba(210, 153, 34, 0.55); color: #f0c36a; }
    button.danger { background: rgba(248, 81, 73, 0.16); border-color: rgba(248, 81, 73, 0.62); color: #ff938a; }
    button.danger.confirm { background: var(--danger-strong); border-color: var(--danger-strong); color: #fff; }
    button.ghost { background: transparent; }
    button[disabled] { cursor: default; opacity: 0.45; transform: none; }
    .token { display: grid; grid-template-columns: minmax(220px, 420px) auto auto; gap: 8px; align-items: center; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric, .workspace, .dialog {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .metric { padding: 14px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 6px; font-size: 28px; line-height: 1; }
    .tabs {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }
    .tab {
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }
    .tab.active {
      background: var(--panel-2);
      border-color: var(--line);
      color: var(--text);
    }
    .view-head {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .view-title h2 { margin: 0; font-size: 15px; line-height: 1.25; }
    .view-title p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 860px; }
    .col-date { width: 160px; }
    .col-peer { width: 190px; }
    .col-small { width: 86px; }
    .col-actions { width: 168px; }
    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      background: #111820;
    }
    tr:hover td { background: rgba(88, 166, 255, 0.04); }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .peer-id {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      padding: 4px 7px;
      border: 1px solid rgba(139, 148, 158, 0.22);
      border-radius: 6px;
      background: #0d1117;
      color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      min-width: 68px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #111820;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .badge.warning { color: #f0c36a; border-color: rgba(210, 153, 34, 0.45); background: rgba(210, 153, 34, 0.12); }
    .badge.banned { color: #ff938a; border-color: rgba(248, 81, 73, 0.5); background: rgba(248, 81, 73, 0.12); }
    .empty, .error { padding: 28px 16px; color: var(--muted); text-align: center; }
    .error { color: var(--danger); }
    .pager {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .pager strong { color: var(--text); font-weight: 600; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(1, 4, 9, 0.72);
      backdrop-filter: blur(8px);
    }
    .modal-backdrop.open { display: flex; }
    .dialog {
      width: min(560px, 100%);
      overflow: hidden;
    }
    .dialog-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .dialog-head h2 { margin: 0; font-size: 16px; line-height: 1.25; }
    .dialog-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .dialog-body { padding: 16px 18px; }
    .dialog-foot {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: #111820;
    }
    @media (max-width: 920px) {
      header { align-items: stretch; flex-direction: column; }
      .token { grid-template-columns: 1fr auto auto; }
      main { padding: 14px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .view-head { align-items: flex-start; flex-direction: column; }
      table { min-width: 760px; }
    }
    @media (max-width: 560px) {
      .token { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; }
      .pager { justify-content: space-between; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PeerLink X Moderation</h1>
    <div class="token">
      <input id="token" type="password" placeholder="Moderator token">
      <button id="saveToken" class="primary" type="button">Save</button>
      <button id="refresh" class="ghost" type="button">Refresh</button>
    </div>
  </header>
  <main>
    <div class="metrics" id="metrics"></div>
    <section class="workspace">
      <nav class="tabs" aria-label="Moderation sections">
        <button class="tab active" type="button" data-tab="reports">Incoming Reports</button>
        <button class="tab" type="button" data-tab="reported">Reported Users</button>
        <button class="tab" type="button" data-tab="reporters">Reporters</button>
        <button class="tab" type="button" data-tab="appeals">Appeals</button>
      </nav>
      <div class="view-head">
        <div class="view-title">
          <h2 id="viewTitle">Incoming Reports</h2>
          <p id="viewMeta">Metadata-only reports</p>
        </div>
      </div>
      <div id="content"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
  <div class="modal-backdrop" id="decisionModal" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="decisionTitle">
      <div class="dialog-head">
        <h2 id="decisionTitle">Moderator action</h2>
        <p id="decisionMeta"></p>
      </div>
      <div class="dialog-body">
        <textarea id="decisionNote" spellcheck="true"></textarea>
      </div>
      <div class="dialog-foot">
        <button class="ghost" id="decisionCancel" type="button">Cancel</button>
        <button class="primary" id="decisionConfirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const apiBase = '/api';
    const pageSize = 20;
    const tokenInput = document.querySelector('#token');
    const metricsEl = document.querySelector('#metrics');
    const contentEl = document.querySelector('#content');
    const pagerEl = document.querySelector('#pager');
    const titleEl = document.querySelector('#viewTitle');
    const metaEl = document.querySelector('#viewMeta');
    const decisionModal = document.querySelector('#decisionModal');
    const decisionTitle = document.querySelector('#decisionTitle');
    const decisionMeta = document.querySelector('#decisionMeta');
    const decisionNote = document.querySelector('#decisionNote');
    const decisionCancel = document.querySelector('#decisionCancel');
    const decisionConfirm = document.querySelector('#decisionConfirm');
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const state = {
      activeTab: 'reports',
      pages: { reports: 1, reported: 1, reporters: 1, appeals: 1 },
      data: { reports: [], reported: [], reporters: [], appeals: [] },
    };
    const labels = {
      reports: ['Incoming Reports', 'Metadata-only reports'],
      reported: ['Reported Users', 'Peers reported by other users'],
      reporters: ['Reporters', 'Users who submitted reports'],
      appeals: ['Appeals', 'Ban appeals and unban actions'],
    };

    tokenInput.value = sessionStorage.getItem('moderationToken') || '';

    function authHeaders() {
      const token = tokenInput.value.trim();
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    async function getJson(path) {
      const res = await fetch(`${apiBase}${path}`, { headers: authHeaders() });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function postJson(path, body) {
      const res = await fetch(`${apiBase}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function fmt(value) {
      return value ? new Date(value).toLocaleString() : '-';
    }

    function shortPeerId(value) {
      const peerId = String(value ?? '').trim();
      if (peerId.length <= 18) return peerId || '-';
      return `${peerId.slice(0, 8)}...${peerId.slice(-8)}`;
    }

    function peerCell(value) {
      const peerId = String(value ?? '').trim();
      return `<span class="peer-id" title="${esc(peerId)}">${esc(shortPeerId(peerId))}</span>`;
    }

    function metric(label, value) {
      return `<div class="metric"><span>${label}</span><strong>${value ?? 0}</strong></div>`;
    }

    function badge(value) {
      const cls = value === 'banned' ? 'banned' : value === 'warning' ? 'warning' : '';
      return `<span class="badge ${cls}">${esc(value || 'clear')}</span>`;
    }

    function defaultDecisionNote(action, reportCount, reporterCount) {
      const reports = Number(reportCount || 0);
      const reporters = Number(reporterCount || 0);
      if (action === 'ban') {
        return `Account blocked because ${reports} reports were received from ${reporters} users. Reporter Peer IDs are not disclosed.`;
      }
      return `Warning issued because ${reports} reports were received from ${reporters} users. Reporter Peer IDs are not disclosed.`;
    }

    function openDecisionModal({ title, meta, note, confirmLabel, danger }) {
      return new Promise((resolve) => {
        decisionTitle.textContent = title;
        decisionMeta.textContent = meta;
        decisionNote.value = note;
        decisionConfirm.textContent = confirmLabel;
        decisionConfirm.classList.toggle('danger', danger);
        decisionConfirm.classList.toggle('confirm', danger);
        decisionConfirm.classList.toggle('primary', !danger);
        decisionModal.classList.add('open');
        decisionModal.setAttribute('aria-hidden', 'false');
        decisionNote.focus();
        decisionNote.setSelectionRange(decisionNote.value.length, decisionNote.value.length);

        const close = (value) => {
          decisionModal.classList.remove('open');
          decisionModal.setAttribute('aria-hidden', 'true');
          decisionCancel.removeEventListener('click', onCancel);
          decisionConfirm.removeEventListener('click', onConfirm);
          decisionModal.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKeydown);
          resolve(value);
        };
        const onCancel = () => close(null);
        const onConfirm = () => close(decisionNote.value.trim());
        const onBackdrop = (event) => {
          if (event.target === decisionModal) close(null);
        };
        const onKeydown = (event) => {
          if (event.key === 'Escape') close(null);
          if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
            close(decisionNote.value.trim());
          }
        };
        decisionCancel.addEventListener('click', onCancel);
        decisionConfirm.addEventListener('click', onConfirm);
        decisionModal.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKeydown);
      });
    }

    async function actPeer(peerId, action, reportCount, reporterCount) {
      const note = await openDecisionModal({
        title: action === 'ban' ? 'Ban user' : 'Warn user',
        meta: shortPeerId(peerId),
        note: defaultDecisionNote(action, reportCount, reporterCount),
        confirmLabel: action === 'ban' ? 'Ban' : 'Warn',
        danger: action === 'ban',
      });
      if (note === null) return;
      await postJson(`/admin/moderation/peers/${encodeURIComponent(peerId)}/action`, {
        action,
        note,
        reportCount,
        reporterCount,
      });
      await load();
    }
    window.actPeer = actPeer;

    async function unbanAppeal(appealId, peerId) {
      const note = await openDecisionModal({
        title: 'Unban user',
        meta: shortPeerId(peerId),
        note: 'Appeal accepted. Account is unblocked.',
        confirmLabel: 'Unban',
        danger: false,
      });
      if (note === null) return;
      await postJson(`/admin/moderation/appeals/${encodeURIComponent(appealId)}/unban`, { note });
      await load();
    }
    window.unbanAppeal = unbanAppeal;

    function pageItems(items) {
      const page = state.pages[state.activeTab] || 1;
      return items.slice((page - 1) * pageSize, page * pageSize);
    }

    function renderPager(items) {
      const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
      const page = Math.min(state.pages[state.activeTab] || 1, totalPages);
      state.pages[state.activeTab] = page;
      if (items.length <= pageSize) {
        pagerEl.innerHTML = '';
        return;
      }
      const start = (page - 1) * pageSize + 1;
      const end = Math.min(items.length, page * pageSize);
      pagerEl.innerHTML = `
        <span><strong>${start}-${end}</strong> of <strong>${items.length}</strong></span>
        <button class="ghost" type="button" onclick="changePage(-1)" ${page <= 1 ? 'disabled' : ''}>Prev</button>
        <span>Page <strong>${page}</strong> / ${totalPages}</span>
        <button class="ghost" type="button" onclick="changePage(1)" ${page >= totalPages ? 'disabled' : ''}>Next</button>
      `;
    }

    function changePage(delta) {
      state.pages[state.activeTab] = (state.pages[state.activeTab] || 1) + delta;
      render();
    }
    window.changePage = changePage;

    function renderReports(items) {
      const reports = pageItems(items);
      if (!items.length) return '<div class="empty">No reports</div>';
      return `<div class="table-wrap"><table>
        <thead><tr><th class="col-date">Received</th><th class="col-peer">Reported peer</th><th class="col-peer">Reporter</th><th>Reason</th><th class="col-small">Type</th><th class="col-small">Content</th></tr></thead>
        <tbody>${reports.map((report) => `<tr>
          <td>${fmt(report.receivedAt)}</td>
          <td>${peerCell(report.reportedPeerId)}</td>
          <td>${peerCell(report.reporterPeerId)}</td>
          <td>${esc(report.reason)}</td>
          <td>${esc(report.type)}</td>
          <td>metadata only</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }

    function renderPeerAggregate(items, emptyText, withActions) {
      const peers = pageItems(items);
      if (!items.length) return `<div class="empty">${emptyText}</div>`;
      return `<div class="table-wrap"><table>
        <thead><tr><th class="col-peer">Peer ID</th><th class="col-small">Reports</th><th class="col-small">Users</th><th class="col-small">Direct</th><th class="col-small">Group</th><th class="col-date">Last report</th><th class="col-actions">${withActions ? 'Decision' : 'Status'}</th></tr></thead>
        <tbody>${peers.map((peer) => `<tr>
          <td>${peerCell(peer.peerId)}</td>
          <td>${peer.reportCount || 0}</td>
          <td>${peer.reporterCount || 0}</td>
          <td>${peer.directCount || 0}</td>
          <td>${peer.groupCount || 0}</td>
          <td>${fmt(peer.lastReportAt)}</td>
          <td class="actions">${withActions
            ? `<button class="warn js-act-peer" type="button" data-peer="${esc(peer.peerId)}" data-action="warn" data-reports="${peer.reportCount || 0}" data-reporters="${peer.reporterCount || 0}">Warn</button><button class="danger js-act-peer" type="button" data-peer="${esc(peer.peerId)}" data-action="ban" data-reports="${peer.reportCount || 0}" data-reporters="${peer.reporterCount || 0}">Ban</button>`
            : 'metadata only'}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }

    function renderAppeals(items) {
      const appeals = pageItems(items);
      if (!items.length) return '<div class="empty">No appeals</div>';
      return `<div class="table-wrap"><table>
        <thead><tr><th class="col-date">Created</th><th class="col-peer">Peer ID</th><th class="col-small">Status</th><th>Appeal</th><th class="col-date">Resolved</th><th class="col-actions">Decision</th></tr></thead>
        <tbody>${appeals.map((appeal) => `<tr>
          <td>${fmt(appeal.createdAt)}</td>
          <td>${peerCell(appeal.peerId)}</td>
          <td>${esc(appeal.status)}</td>
          <td>${esc(appeal.text)}</td>
          <td>${fmt(appeal.resolvedAt)}</td>
          <td class="actions">${appeal.status === 'open'
            ? `<button class="primary js-unban-appeal" type="button" data-appeal="${esc(appeal.id)}" data-peer="${esc(appeal.peerId)}">Unban</button>`
            : esc(appeal.resolutionAction || '-')}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }

    function render() {
      tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === state.activeTab));
      titleEl.textContent = labels[state.activeTab][0];
      metaEl.textContent = labels[state.activeTab][1];
      const items = state.data[state.activeTab] || [];
      renderPager(items);
      if (state.activeTab === 'reports') contentEl.innerHTML = renderReports(items);
      if (state.activeTab === 'reported') contentEl.innerHTML = renderPeerAggregate(items, 'No reported users', true);
      if (state.activeTab === 'reporters') contentEl.innerHTML = renderPeerAggregate(items, 'No reporters', false);
      if (state.activeTab === 'appeals') contentEl.innerHTML = renderAppeals(items);
    }

    async function load() {
      try {
        const [summary, reports, reportedPeers, reporters, appeals] = await Promise.all([
          getJson('/admin/moderation/summary'),
          getJson('/admin/reports?limit=500'),
          getJson('/admin/moderation/reported-peers?limit=500'),
          getJson('/admin/moderation/reporters?limit=500'),
          getJson('/admin/moderation/appeals?status=all&limit=500'),
        ]);
        const s = summary.summary || {};
        metricsEl.innerHTML = [
          metric('Reports', s.total),
          metric('Warnings', s.warned_peers),
          metric('Bans', s.banned_peers),
        ].join('');
        state.data.reports = reports.reports || [];
        state.data.reported = reportedPeers.peers || [];
        state.data.reporters = reporters.peers || [];
        state.data.appeals = appeals.appeals || [];
        render();
      } catch (error) {
        metricsEl.innerHTML = '';
        pagerEl.innerHTML = '';
        contentEl.innerHTML = `<div class="error">${esc(error.message)}</div>`;
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        state.activeTab = tab.dataset.tab;
        render();
      });
    });
    contentEl.addEventListener('click', (event) => {
      const actionButton = event.target.closest('.js-act-peer');
      if (actionButton) {
        actPeer(
          actionButton.dataset.peer,
          actionButton.dataset.action,
          actionButton.dataset.reports,
          actionButton.dataset.reporters,
        );
        return;
      }
      const unbanButton = event.target.closest('.js-unban-appeal');
      if (unbanButton) {
        unbanAppeal(unbanButton.dataset.appeal, unbanButton.dataset.peer);
      }
    });
    document.querySelector('#saveToken').addEventListener('click', () => {
      sessionStorage.setItem('moderationToken', tokenInput.value.trim());
      load();
    });
    document.querySelector('#refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
