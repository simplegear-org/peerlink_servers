apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: PeerLink Observability DB
    uid: peerlink-observability-db
    type: postgres
    access: proxy
    url: push-observability-db:5432
    database: peerlink_observability
    user: peerlink
    secureJsonData:
      password: ${PUSH_OBSERVABILITY_POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
