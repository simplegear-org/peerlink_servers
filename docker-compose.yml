services:
  relay:
    image: ${RELAY_IMAGE:-tangash/relay:1.7.9-2026092403}
    container_name: relay
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
    volumes:
      - relay-data:/app/data/relay

  signal:
    image: ${SIGNAL_IMAGE:-tangash/signal:1.7.9-2026092403}
    container_name: signal
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production

  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.6.2}
    container_name: coturn
    restart: always
    network_mode: host
    environment:
      - TURN_PORT=3478
      - TURNS_PORT=5349
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf
      - /etc/ssl/certs/selfsigned.crt:/etc/coturn/certs/fullchain.pem:ro
      - /etc/ssl/private/selfsigned.key:/etc/coturn/private/privkey.pem:ro

  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy:2.9-alpine}
    container_name: haproxy
    restart: always
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE
    network_mode: host
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
      - /etc/ssl/certs/selfsigned.pem:/usr/local/etc/haproxy/certs/haproxy.pem:ro

volumes:
  relay-data:
